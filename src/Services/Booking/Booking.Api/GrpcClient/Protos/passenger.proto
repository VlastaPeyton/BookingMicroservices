// Pogledaj gRCP.txt i flight.proto

syntax = "proto3";

package passenger; // Postace namespace nakon build

service PassengerGrpcService{
	// gRCP endpoints koje ce C# da generise kao sync/async 
	rpc GetByIdGrpc (GetPassengerByIdRequestGrpc) returns (GetPassengerByIdResultGrpc);
}

message GetPassengerByIdRequestGrpc {
	string Id = 1;
}

message GetPassengerByIdResultGrpc{
	PassengerResponse PassengerDto = 1;
}

message PassengerResponse{
	string Id = 1;
	string Name = 2;
	string PassportNumber = 3;
	PassengerTypeGrpc PassengerType = 4;
	int32 Age = 5;
}

enum PassengerTypeGrpc {
	PASSENGER_TYPE_UNKNOWN = 0;
	PASSENGER_TYPE_MALE = 1;
    PASSENGER_TYPE_FEMALE = 2;
    PASSENGER_TYPE_BABY = 3;
}